<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymBro</title>
<meta name="theme-color" content="#F3F0EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GymBro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@font-face{font-family:Inter;font-weight:500;font-style:normal;font-display:swap;src:url(inter-500.woff) format("woff")}
@font-face{font-family:Inter;font-weight:600;font-style:normal;font-display:swap;src:url(inter-600.woff) format("woff")}
@font-face{font-family:Inter;font-weight:700;font-style:normal;font-display:swap;src:url(inter-700.woff) format("woff")}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
:root{--bg:#F3F0EA;--surface:#FFFFFF;--text:#24262B;--muted:#5F5D56;--accent:#E8590C;--accent-soft:#FFE9DB;--done:#8BC34A;--on-done:#1F2A14;--danger:#C23B3B;--line:#E6E1D7;--fin:var(--line);--border:#8A8478;--icon:var(--muted);
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;
--b:var(--accent);--ink:var(--text);--mut:var(--muted);--fill:var(--accent-soft);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/22px Inter,-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:420px;margin:0 auto;padding:var(--s5) var(--s4) 90px;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;border-radius:var(--r-md);padding:var(--s2) var(--s3);min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:4px 0 var(--s3)}
input,textarea{color:var(--text)}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:110px}
label{display:block;font:500 14px/20px Inter,sans-serif;color:var(--muted)}
.bar{display:flex;align-items:center;gap:var(--s3);margin:0 0 var(--s5)}
.bar b{flex:1;font:700 28px/34px Inter,sans-serif;letter-spacing:-.3px}
.bar button{color:var(--icon)}
.bar button[data-a="save"]{color:var(--accent)}
.bar>b:first-child{font:700 18px/24px Inter,sans-serif;letter-spacing:0}
.card,.ex{background:var(--surface);border:0;border-radius:var(--r-lg);padding:var(--s4);margin-bottom:var(--s3);display:flex;flex-direction:column;gap:var(--s2);box-shadow:0 1px 2px rgba(36,38,43,.06),0 4px 14px rgba(36,38,43,.06)}
.card{cursor:pointer}
.card[data-a="day"] .row:first-child>span:first-child{font:600 20px/26px Inter,sans-serif}
.ex{flex-direction:row;align-items:center;gap:var(--s3);padding:var(--s4)}
.ex .g{display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start}
.ex.fin{background:var(--fin);box-shadow:none}
.wb.empty{min-width:40px}
.wb.empty[data-f="w"]{min-width:64px}
.ex.fin .wb{background:var(--bg)}
.ex .cb{width:28px;height:28px;min-height:28px}
.ex.fin .cb:not(.on){background:var(--fin)}
.ex b{font:600 16px/22px Inter,sans-serif}
.g{flex:1;cursor:pointer}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.row:has(>.chip){gap:var(--s1)}
.mut{color:var(--muted);font:500 14px/20px Inter,sans-serif}
.tag{background:var(--accent);color:#fff;font-style:normal;font-size:12px;padding:2px 8px;border-radius:var(--r-pill)}
.chip{background:transparent;color:var(--text);border:1.5px solid var(--border);border-radius:var(--r-pill);padding:2px 11px;font:600 13px/18px Inter,sans-serif;min-height:0}
span.chip{background:transparent;border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{display:inline-flex;align-items:center;gap:2px;background:var(--done);color:var(--on-done);font:700 13px/18px Inter,sans-serif;padding:4px 12px;border-radius:var(--r-pill)}
.cb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;min-height:32px;padding:0;font-size:16px;font-weight:700;flex:none;border-radius:50%;border:2px solid var(--border);background:var(--surface)}
.cb.on{background:var(--done);border-color:var(--done);color:var(--on-done)}
.wb{padding:4px 8px;min-height:32px;background:var(--fin);border-radius:var(--r-sm);font:500 15px/20px Inter,sans-serif}
.ph{border:1.5px dashed var(--line);border-radius:var(--r-lg);height:150px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin:var(--s3) 0;background:var(--surface)}
h3{margin:var(--s6) 0 var(--s2);font:600 18px/24px Inter,sans-serif}
ul{margin:var(--s1) 0;padding-left:20px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);margin:0 0 var(--s2);display:flex;justify-content:space-between;gap:var(--s2);align-items:center}
.note button{color:var(--accent);font-weight:600;min-height:36px}
.full{width:100%;margin-top:var(--s3);padding:12px 20px;border-radius:var(--r-lg);background:transparent;color:var(--icon);border:1.5px solid var(--border);font:600 16px/20px Inter,sans-serif}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:var(--s4)}
.sheet{background:var(--surface);border-radius:var(--r-lg);padding:var(--s5) var(--s4) var(--s4);width:100%;max-width:320px;text-align:center;box-shadow:0 8px 32px rgba(36,38,43,.24)}
.sheet>b{display:block;font:600 16px/22px Inter,sans-serif}
.sheet p{margin:var(--s1) 0 var(--s3);font:500 14px/20px Inter,sans-serif}
.sheet input{margin:var(--s5) 0 var(--s4);text-align:left}
.sheet .hint{margin:calc(-1*var(--s3)) 0 var(--s4);text-align:left;color:var(--muted);font:500 13px/18px Inter,sans-serif}
.sheet input.err{border-color:var(--danger)}
.sheet .errt{margin:calc(-1*var(--s3)) 0 var(--s4);text-align:left;color:var(--danger);font:500 14px/20px Inter,sans-serif}
.sheet{position:relative}
.sheet>b{padding:0 var(--s6)}
.sheet .x{position:absolute;top:var(--s3);right:var(--s1);width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--icon);padding:0}
.sheet .row{flex-direction:column;gap:var(--s2)}
.sheet .row button{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:44px;padding:0 var(--s3);border-radius:var(--r-lg);font:600 16px/20px Inter,sans-serif}
.sheet .row button[data-a="sv"]{background:var(--accent);color:#fff;border:1.5px solid var(--accent)}
.sheet .row button.lnk{background:transparent;border:0;color:var(--muted);text-decoration:underline;font:500 14px/20px Inter,sans-serif;min-height:44px}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:#fff;min-height:44px;padding:0 var(--s5);padding-top:var(--s2);padding-bottom:var(--s2);border-radius:22px;display:flex;gap:var(--s4);align-items:center;font:500 14px/20px Inter,sans-serif;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(36,38,43,.18)}
.toast:has(button){padding-right:var(--s2)}
.toast button{min-height:28px;width:28px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--accent-soft);font:600 14px/20px Inter,sans-serif}
.wf{display:none}

/* dashboard: den na řadě, tišší hotovo, průběh, text místo štítků */
.card.fin{background:var(--fin);box-shadow:none}
.card.fin .prog{display:none}
.fin-i{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font:500 14px/20px Inter,sans-serif}
.cb.mini{width:20px;height:20px;min-height:20px;border-width:0;font-size:0;cursor:default}
.chev{color:var(--muted);flex:none}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
span.chip{background:transparent;border:0;padding:0;border-radius:0;color:var(--muted);font:500 14px/20px Inter,sans-serif}
span.chip+span.chip::before{content:"·";margin:0 6px}
.row:has(>span.chip){gap:0}

.sub{margin:0 0 var(--s4)}
.hdr+.card{margin-top:var(--s5)}
.sub+.card{margin-top:0}
.hdr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:0 0 -8px}
.hdr b{text-align:center;font:600 20px/26px Inter,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr button{color:var(--icon);display:flex;align-items:center;justify-content:center}
.ttl b{font:700 28px/34px Inter,sans-serif;letter-spacing:-.3px}
.ttl button{color:var(--icon)}
</style>
</head>

chest:{n:"Chest Press",s:3,r:"12",w:"15",m:"sed. 6",i:["Madla ve výšce středu hrudníku, ne u ramen.","Lopatky dozadu a dolů, hrudník vzhůru.","Lokty mírně dolů, nevystrkovat do stran, ani nezamykat při vytlačení."]},

row:{n:"Matrix Seated Row",s:3,r:"12",w:"14",m:"sed. 3, opěrka 2",i:["Hrudník se opírá o podložku a neodklání se dozadu.","Madla jsou ve výšce středu/spodní části hrudníku.","Táhnout lokty dozadu a na konci stáhnout lopatky k sobě."],notes:["Táhne mě za krkem, ruce jak moc daleko"]},
pect:{n:"Pectoral",s:3,r:"12",w:"5",m:"sed. 6",i:["Ruce při pohybu přibližně ve výšce středu hrudníku.","Lokty lehce pokrčené.","Ramena dolů, lopatky lehce dozadu."]},
rfly:{n:"Reverse Fly",s:3,r:"10",w:"2,5",m:"sed. 4",i:["Paže přibližně ve výšce ramen.","Hrudník zůstává na opěrce.","Ramena dolů od uší – tohle si hlídat opravdu hodně."],notes:["Udělala jsem sotva 2x5"]},
tric:{n:"Triceps Press",s:3,r:"12",w:"29",m:"sed. 3",i:["Ramena nesmí být vytažená k uším.","Chodidla celou plochou na zemi.","Lokty relativně u těla."]},
lpress:{n:"Leg Press",s:3,r:"12",w:"63",m:"sed. 1",i:["Celá záda i pánev na opěrce.","Chodidla na šířku ramen a na střed platformy.","Kolena na směru špiček, nemají padat dovnitř.","Vytlačovat přes celé chodidlo."]},
pend:{n:"Pendulum Squat / Hack Squat",s:3,r:"",w:"",m:"sed. 1",i:["Chodidla začni přibližně na šířku ramen, špičky mohou mírně ven.","Dolů jdi jen do hloubky, která je komfortní.","Nahoře kolena agresivně nezamykej."]},
lcurl:{n:"Leg Curl",s:3,r:"12",w:"14",m:"sed. a nohy 4, madlo 3",i:["Koleno odpovídá ose otáčení stroje.","Spodní válec je nad kotníky/na spodní části lýtek, ne vysoko.","Zakopávat pohybem v koleni, nepomáhat trupem."]},
lext:{n:"Leg Extension",s:3,r:"8",w:"15",m:"1-2-3",i:["Koleno odpovídá ose otáčení stroje.","Spodní válec je nad nártem na spodní části holeně, ne na chodidle.","Nahoře nedávat kolena do maximálního propnutí."]},
mlext:{n:"Matrix Leg Extension",s:3,r:"8",w:"14",m:"sed. 3, nohy 2",i:["Koleno odpovídá ose otáčení stroje.","Nahoře nedávat kolena do maximálního propnutí."]},
abd:{n:"Abductor",s:3,r:"12",w:"20",m:"",i:["Neodrážet závaží a nešvihat nohama.","V krajní pozici můžu na moment zastavit a stáhnout hýždě."]},
rcr:{n:"Reverse Crunch",s:3,r:"12",w:"0",m:"",img:1,i:["Lehnout na záda, ruce vedle těla.","Pokrčit kolena přibližně do 90°.","Pomocí břišních svalů podsazovat pánev a lehce zvedat kostrč od podložky."]},
wide:{n:"Wide Grip Pulldown",s:3,r:"12",w:"20,3",m:"",i:["Úchop lehce víc než je šíře ramen.","Krk v přirozeném prodloužení páteře, nezaklánět hlavu.","Lokty táhnout dolů směrem k bokům."],notes:["Mám mířit na prsa nebo kam?"]},
shp:{n:"Shoulder Press",s:3,r:"10",w:"5",m:"sed. 6",i:["Madla mají být přibližně ve výšce ramen nebo lehce pod nimi.","Nahoře ruce natáhnout, nezamykat lokty.","Neprohýbat se v bedrech."],notes:["Bolí mě jedno rameno"]},
delts:{n:"Delts Machine",s:3,r:"8",w:"2,5",m:"sed. 7, ruce 1",i:["Lokty pokrčené přibližně do 90°, mírně před trupem.","Nadloktí opřené o polstrované opěrky.","Nahoře končit ve výšce ramen."]},
bic:{n:"Biceps Curl",s:3,r:"8",w:"14",m:"sed. 2",i:["Nadloktí leží na opěrce, nezvedají se z ní.","Ohýbat lokty směrem k sobě.","Dolů se vracet pomalu do téměř natažených paží."]},
hip:{n:"Dual 45 Hip Extension",s:3,r:"",w:"",m:"",i:[]},
glute:{n:"Glute Trainer",s:3,r:"12",w:"14",m:"opěrka 3",i:[]},
add:{n:"Adductor",s:3,r:"12",w:"20",m:"",i:[]},
cable:{n:"Cable Woodchop",s:3,r:"",w:"7,5",m:"",i:[]}
};
for(var k in E){E[k].h=[];E[k].notes=E[k].notes||[]}
var D=[
{id:"A",n:"Den A",p:"záda + hrudník",ex:["chest","pull","row","pect","rfly","tric"],done:{}},
{id:"B",n:"Den B",p:"stehna + hýždě",ex:["lpress","pend","lcurl","lext","mlext","abd","rcr"],done:{}},
{id:"C",n:"Den C",p:"záda + ramena + paže",ex:["wide","row","shp","delts","bic","rfly"],done:{}},
{id:"D",n:"Den D",p:"hýždě + zadní strana nohou",ex:["hip","glute","lcurl","lpress","pend","add","cable"],done:{}}];
var KEY="gymbro:v1",KLB="gymbro:lastbackup";
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv&&sv.E&&sv.D){for(var k in E)delete E[k];Object.assign(E,sv.E);D.length=0;sv.D.forEach(function(x){D.push(x)})}}catch(e){}
var sheetErr=false,menu=false,nav=[{v:"home"}],edit=false,sheet=null,sheetF="w",toast=null,undo=null,A=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var PARTS=["záda","hrudník","ramena","paže","stehna","hýždě","zadní strana nohou","břicho"];
function top(){return nav[nav.length-1]}
function XV(e,dy){var x=E[e],d=dy&&dd(dy),o=d&&d.ov&&d.ov[e];return o?Object.assign({},x,o):x}
function dctx(){var t=top();if(t.v=="day")return t.id;var p=nav[nav.length-2];return p&&p.v=="day"?p.id:null}
function differs(e,dy){var d=dy&&dd(dy),o=d&&d.ov&&d.ov[e];return !!o&&Object.keys(o).some(function(k){return String(o[k])!==String(E[e][k])})}
function dd(id){return D.filter(function(d){return d.id==id})[0]}
function uid(){return Math.random().toString(36).slice(2,7)}
function CHK(n){return '<svg width="'+n+'" height="'+n+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M5 12.5l5 5L19.5 7"/></svg>'}
function bar(t,back,right){return '<div class="bar">'+(back?'<button data-a="back" aria-label="Zpět" style="border:none;background:none;min-width:44px;padding:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>':'')+'<b>'+esc(t)+'</b>'+(right||'')+'</div>'}
function sum(x){return x.s+"×"+(x.r||"?")}
function wt(x){return x.w&&x.w!="0"?x.w+" kg":"bez váhy"}

function take(){snaps.push(snapNow())}
function discard(){var s=snaps.pop();if(s===undefined)return false;var changed=s!==snapNow(),o=JSON.parse(s);for(var k in E)delete E[k];Object.assign(E,o.E);D.length=0;o.D.forEach(function(x){D.push(x)});return changed}
var SAVE='<button data-a="save" aria-label="Uložit změny" style="border:none;background:none;min-width:44px;padding:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l5 5L19.5 7"/></svg></button>';
var HINT={n:"Název cviku, nejvýše 40 znaků.",s:"Počet sérií, celé číslo od 1.",r:"Číslo nebo rozsah, např. 12 nebo 8–10.",w:"Váha v kg, např. 12,5. Zadej 0 pro cvik bez váhy.",m:"Libovolný text, např. nastavení sedadla."};
var LBL={n:"Název",s:"Série",r:"Opakování",w:"Váha (kg)",m:"Nastavení stroje"};
function vb(e,f,txt){var em=!txt;return '<button class="wb'+(em?' empty':'')+'" data-a="ef" data-id="'+e+'" data-f="'+f+'"'+(em?' aria-label="'+LBL[f]+' (nevyplněno)"':'')+'>'+(em?'&nbsp;':esc(txt))+'</button>'}
function wtxt(x){return x.w===""?"":(x.w=="0"?"bez váhy":x.w+" kg")}
function vals(e,dy){var x=XV(e,dy),p=[];
 p.push(vb(e,"s",x.s?String(x.s):"")+' × '+vb(e,"r",x.r?String(x.r):""));

 return '<div class="row">'+p.join(" · ")+'</div>'+(x.m?'<div class="mut">'+esc(x.m)+'</div>':'')}
function home(){
 var nx=D.filter(function(d){return !d.ex.every(function(e){return d.done[e]})})[0];
 var prof='<div style="position:relative"><button data-a="prof" aria-label="Profil" aria-expanded="'+menu+'" style="border:none;background:none;min-width:44px;padding:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.5"/><path d="M5 19c2-4 12-4 14 0"/></svg></button>'+(menu?'<div style="position:absolute;right:0;top:48px;z-index:5;background:var(--bg);border:2px solid var(--b);border-radius:8px;padding:4px;min-width:210px"><button data-a="backup" style="border:none;background:none;width:100%;text-align:left">Záloha a obnova dat</button></div>':'')+'</div>';
 return bar("GymBro",0,prof)+D.map(function(d){
  var n=d.ex.filter(function(e){return d.done[e]}).length,all=d.ex.length&&n==d.ex.length;
  var cls="card"+(nx&&nx.id==d.id?" next":"")+(all?" fin":""),pct=d.ex.length?Math.round(100*n/d.ex.length):0;
  var cnt=all?'<span class="fin-i"><span class="cb on mini">'+CHK(12)+'</span>'+n+'/'+d.ex.length+' cviků</span>':'<span class="mut">'+n+'/'+d.ex.length+' cviků</span>';
